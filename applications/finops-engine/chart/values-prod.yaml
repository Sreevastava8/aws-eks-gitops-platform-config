---
replicaCount: 3

env:
  APP_ENV: prod
  LOG_LEVEL: INFO
  AWS_REGION: ap-south-1
  MOCK_EXTERNAL_SERVICES: "false"
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2