---
replicaCount: 2

env:
  APP_ENV: qa
  LOG_LEVEL: INFO
  AWS_REGION: ap-south-1
  MOCK_EXTERNAL_SERVICES: "false"
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1