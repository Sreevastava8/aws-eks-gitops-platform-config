---
replicaCount: 2

image:
  repository: REPLACE_WITH_ECR_REPOSITORY
  tag: "REPLACE_WITH_IMAGE_TAG"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# EKS Pod Identity is used for AWS authentication.
# No IRSA annotation is required.
serviceAccount:
  create: true
  name: finops-engine
  annotations: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

containerPort: 8000

env:
  APP_ENV: dev
  LOG_LEVEL: INFO
  AWS_REGION: ap-south-1
  MOCK_EXTERNAL_SERVICES: "true"
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: finops.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /ready
  initialDelaySeconds: 5
  periodSeconds: 5

nodeSelector: {}

tolerations: []

affinity: {}

configMap:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceMonitor:
  enabled: true