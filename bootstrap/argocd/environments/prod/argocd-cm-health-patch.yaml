apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for child Application health assessment"
    if obj.status == nil then return hs end
    if obj.status.health == nil then return hs end
    if obj.status.health.status == "Degraded" then
      hs.status = "Degraded"
      hs.message = obj.status.health.message or "Application is degraded"
      return hs
    end
    if obj.status.health.status == "Healthy"
       and obj.status.sync ~= nil
       and obj.status.sync.status == "Synced" then
      hs.status = "Healthy"
      hs.message = "Application is synced and healthy"
      return hs
    end
    hs.status = "Progressing"
    hs.message = obj.status.health.message or "Application is progressing"
    return hs