apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finops-prod-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  
spec:
  project: finops-prod

  source:
    repoURL: <REPLACE_WITH_GITOPS_REPO_URL>
    targetRevision: HEAD
    path: platform/storage

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false