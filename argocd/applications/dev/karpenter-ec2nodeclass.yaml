---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: karpenter-ec2nodeclass-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: finops-dev

  source:
    repoURL: <REPLACE_WITH_GITOPS_REPO_URL>
    targetRevision: HEAD
    path: platform/ec2nodeclasses
    directory:
      include: dev-ec2nodeclass.yaml

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true