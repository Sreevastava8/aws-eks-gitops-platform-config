---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-secrets-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: finops-dev

  source:
    repoURL: <REPLACE_WITH_GITOPS_REPO_URL>
    targetRevision: HEAD
    path: platform/external-secrets/environments/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: finops-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true