---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: karpenter-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: finops-dev

  sources:
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.15.1
      helm:
        releaseName: karpenter
        valueFiles:
          - $values/platform/karpenter/helm/values.yaml
          - $values/platform/karpenter/helm/environments/dev-values.yaml

    - repoURL: <REPLACE_WITH_GITOPS_REPO_URL>
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true