---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-qa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: finops-qa

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.13.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/platform/monitoring/helm/values.yaml

    - repoURL: <REPLACE_WITH_GITOPS_REPO_URL>
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      




