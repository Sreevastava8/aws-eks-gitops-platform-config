apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dev-apps
  namespace: argocd

spec:
  project: finops-dev

  source:
    repoURL: <REPLACE_WITH_GITOPS_REPO_URL>
    targetRevision: HEAD
    path: argocd/applications/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true