apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: finops-dev
  namespace: argocd

spec:
  description: GitOps project for the DEV environment

  sourceRepos:
    - <REPLACE_WITH_GITOPS_REPO_URL>
    - public.ecr.aws/karpenter
    - https://prometheus-community.github.io/helm-charts
    - https://charts.external-secrets.io

  destinations:
    - namespace: finops-dev
      server: https://kubernetes.default.svc

    - namespace: external-secrets
      server: https://kubernetes.default.svc

    - namespace: monitoring
      server: https://kubernetes.default.svc

    - namespace: karpenter
      server: https://kubernetes.default.svc

    - namespace: argocd
      server: https://kubernetes.default.svc

    - namespace: kube-system
      server: https://kubernetes.default.svc

    - namespace: ""
      server: https://kubernetes.default.svc

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim

    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet

    - group: batch
      kind: Job
    - group: batch
      kind: CronJob

    - group: autoscaling
      kind: HorizontalPodAutoscaler

    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy

    - group: policy
      kind: PodDisruptionBudget

    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: Alertmanager  

    - group: argoproj.io
      kind: Application

    - group: external-secrets.io
      kind: ExternalSecret  

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

    - group: karpenter.sh
      kind: NodePool

    - group: karpenter.k8s.aws
      kind: EC2NodeClass

    - group: external-secrets.io
      kind: ClusterSecretStore

    - group: storage.k8s.io
      kind: StorageClass
      
      
      