apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: prod
  labels:
    environment: prod

spec:
  role: "gitops-karpenter-finops-engine-prod-karpenter-node-role"

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: gitops-karpenter-finops-prod

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: gitops-karpenter-finops-prod

  amiSelectorTerms:
    - alias: al2023@latest

  tags:
    Project: gitops-karpenter-finops-engine
    Environment: prod
    ManagedBy: Karpenter