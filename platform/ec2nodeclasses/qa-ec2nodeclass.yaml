apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: qa
  labels:
    environment: qa

spec:
  role: "gitops-karpenter-finops-engine-qa-karpenter-node-role"

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: gitops-karpenter-finops-qa

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: gitops-karpenter-finops-qa

  amiSelectorTerms:
    - alias: al2023@latest

  tags:
    Project: gitops-karpenter-finops-engine
    Environment: qa
    ManagedBy: Karpenter