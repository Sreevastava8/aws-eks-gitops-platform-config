apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: finops-engine-secret
  namespace: finops-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: finops-engine-secret
    creationPolicy: Owner

  data:
    - secretKey: API_KEY
      remoteRef:
        key: gitops-karpenter-finops/dev/api-key
        property: API_KEY
